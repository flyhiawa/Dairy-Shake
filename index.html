<!DOCTYPE html>
<html dir="ltr" lang="en" class lazy-loaded="true">
	<head>
		<link rel="stylesheet" href="index.css">
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Dairy Shake</title>
	</head>
	<body style="background: rgb(77, 73, 79);">
		<main>
			<header class="header-site">
				<nav class="menu-button">
					<a href="https://github.com/flyhiawa/Dairy-Shake" target="_blank" class="button-nav">GitHub</a>
				</nav>
				<div class="text-button">Source Code</div>
			</header>
			<header class="header-site">
				<nav class="menu-button">
					<a href="#downloads" class="button-nav">Downloads</a>
				</nav>
				<div class="text-button">Downloads Here!</div>
			</header>
			<header class="header-site">
				<nav class="menu-button">
					<a href="#docs" class="button-nav">Docs</a>
				</nav>
				<div class="text-button">Docs Here!</div>
			</header>
			<section class="name">
				<h1 translate="no">Dairy Shake</h1>

				<div class="social-icons">
					<a href="https://discord.gg/3Gqt7hwz9w" target="_blank" rel="noopener noreferrer" class="icon-square" title="Discord">
						<img src="img/discord.svg" alt="Discord">
					</a>
				</div>
			</section>
			<section class="section-site">
				<p class="description">The <b>Dairy Shake</b> Programming Language is an External DSL for abstract logic (classical logic and non-classical logic).</h2>
			</section>
			<hr>
			<section class="section-site">
				<section id="downloads">
					<h2 style="text-align: center; font-family: sans-serif; color: rgb(225, 211, 219);">Downloads!</h2>
					<div class="platforms">
						<div class="line-top">
							<div class="card-platform">
								<img src="img/windows.svg" alt="Windows" class="icon-platform">
								<h3 class="description">Windows</h3>
								<select class="menu-download" name="windows-version">
									<option value="" disabled selected>Select a Version!</option>
									<option value="win-x64">Windows x64 (.exe)</option>
								</select>
								<span class="status-badge">Coming Soon...</span>
							</div>
							<div class="card-platform">
								<img src="img/tux.svg" alt="Linux" class="icon-platform">
								<h3 class="description">Linux</h3>
								<select class="menu-download" name="linux-version">
									<option value="" disabled selected>Select a Version!</option>
									<option value="linux-x64">Linux x86_64 (.tar.gz)</option>
								</select>
								<span class="status-badge">Coming Soon...</span>
							</div>
						</div>
						<div class="line-bottom">
							<div class="card-platform">
								<img src="img/android.svg" alt="Android" class="icon-platform">
								<h3 class="description">Android</h3>
								<select class="menu-download" name="android-version">
									<option value="" disabled selected>Select a Version!</option>
									<option value="android-arm64">Android ARM64</option>
									<option value="android-armv7">Android ARMv7</option>
									<option value="android-x86_64">Android x86_64</option>
								</select>
								<span class="status-badge">Coming Soon...</span>
							</div>
						</div>
					</div>
				</section>
			</section>
			<hr>
			<section class="section-site">
				<section id="docs">
					<h2 style="text-align: center; font-family: sans-serif; color: rgb(225, 211, 219);">Docs!</h2>
					<p style="font-family: sans-serif; color: rgb(225, 211, 219); text-align: center;">
						Coming Soon!
					</p>
				</section>
			</section>
		</main>
	</body>
</html>
